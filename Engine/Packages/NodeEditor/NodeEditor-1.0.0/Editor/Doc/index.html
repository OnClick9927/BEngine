<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Node Editor</title><h1>Node Editor</h1><p>编辑器专用的节点画布，依赖 UIElements.Editor。启用 <code>com.bengine.node-editor</code>，引用 <code>BEngine.NodeEditor.Editor</code>。</p><p><code>BEngine.Editor.UIElements.NodeCanvas</code> 接收节点和连接快照，支持端口、连线、选择、框选、拖动、平移与缩放。图模型、Undo/Redo、保存和运行时图执行由使用方管理。</p><p>公开命名空间保持不变；预编译扩展需要重新编译以引用新程序集。本包不会进入 Player 运行时。</p></html>
