id: com.bengine.physics2d
packageVersion: 1.0.0
minimumEngineVersion: 0.1.0
displayName: 2D Physics
description: >-
  Deterministic Fix64 rigid bodies and 2D colliders with fixed-step simulation, collision and trigger callbacks, spatial queries and simulated-body filtering.
  Build scenes with rigid bodies and box, circle, capsule or polygon colliders. Configure fixed-step simulation, filtering and material response; receive collision/trigger callbacks and use raycast/overlap queries. Includes inspectors, debug views and runnable collision/query examples.
