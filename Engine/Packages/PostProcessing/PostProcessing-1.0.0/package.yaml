format: BEngine.Package
version: 2
type: package
id: com.bengine.postprocessing
packageVersion: 1.0.0
minimumEngineVersion: 0.1.0
displayName: Post Processing
description: >-
  Camera post-processing with Fix64 profile blending, global or circular local volumes, layer filtering, color adjustment, bloom and vignette on RHI render targets.
  Create reusable effect profiles and blend them through global or local volumes. Apply color adjustments, bloom and vignette to Camera2D render targets, with layer filtering and configurable weights. Includes profile/volume inspectors, example scenes and runtime documentation.
enabledByDefault: false
content:
  runtime: Resources
  editor: Editor
runtime:
  assembly: BEngine.PostProcessing
  rootNamespace: BEngine.PostProcessing
  dependencies: []
editor:
  assembly: BEngine.PostProcessing.Editor
  rootNamespace: BEngine.PostProcessing.Editor
  dependencies:
  - packageId: com.bengine.postprocessing
    target: runtime
