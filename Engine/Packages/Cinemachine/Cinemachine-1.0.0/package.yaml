  assembly: BEngine.Cinemachine
  rootNamespace: BEngine.Cinemachine
  dependencies: []
editor:
  assembly: BEngine.Cinemachine.Editor
  rootNamespace: BEngine.Cinemachine.Editor
  dependencies:
  - packageId: com.bengine.cinemachine
    target: runtime
