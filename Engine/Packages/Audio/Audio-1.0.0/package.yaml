displayName: Audio
description: >-
  WAV, MP3 and Ogg Vorbis clips with independent streaming voices, background loading, mono conversion and normalization.
  Author mixer buses, ordered gain, parametric EQ, filter, distortion, chorus, delay, compressor and convolution-reverb effects,
  plus pre/post-fader sends with snapshots, Undo and persistent assets. Includes looping, one-shots, editor preview and replaceable platform output.
