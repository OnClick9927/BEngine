<html lang="zh-CN"><meta charset="utf-8"><title>Timeline</title>
<body><h1>Timeline</h1><p>独立的时间轴编排包：轨道、片段、信号、音视频和动画播放。</p>
<p>依赖 Animation 包。双击 .timeline.yaml 打开编辑器；运行时选中资产匹配的 PlayableDirector 即可观察播放进度。</p>
<p>Control 轨道编排子 Director、嵌套 Timeline 和目标激活；Camera 轨道支持镜头切换与混合。支持反向/循环播放、嵌套信号、预览恢复、Undo/Redo 和 v1 文档兼容。</p>
<p><a href="../Readme.md">使用与扩展说明</a></p></body></html>
