<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BEngine Player</title>
  <link id="bengine-app-icon" rel="icon" type="image/png">
  <link id="bengine-touch-icon" rel="apple-touch-icon">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101214; }
    #bengine-game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #bengine-accessibility { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .bengine-a11y-node {
      position: fixed; overflow: hidden; pointer-events: none; opacity: .001;
      color: transparent; background: transparent; border: 0; white-space: nowrap;
    }
    #bengine-accessibility-live { position: fixed; width: 1px; height: 1px; overflow: hidden; opacity: .001; }
    #bengine-startup {
      position: fixed; inset: 0; display: grid; place-content: center;
      box-sizing: border-box; padding: 24px; color: #e4e7eb; background: #10161a;
      font: 16px/1.5 system-ui, sans-serif; text-align: center; pointer-events: none;
    }
    #bengine-startup-presentation { width: min(240px, 48vw); }
    #bengine-startup-logo { display: block; width: 100%; height: min(180px, 32vh); object-fit: contain; opacity: 0; }
    #bengine-startup-logo[data-animate] { animation: bengine-logo-in .5s linear both; }
    @keyframes bengine-logo-in { from { opacity: 0; } to { opacity: 1; } }
    #bengine-startup-track { height: 5px; margin-top: 28px; background: #394149; overflow: hidden; visibility: hidden; }
    #bengine-startup[data-progress-visible] #bengine-startup-track { visibility: visible; }
    #bengine-startup-progress { width: 100%; height: 100%; background: #c7d3df; transform: scaleX(0); transform-origin: left; }
    #bengine-startup-title, #bengine-startup-detail { display: none; }
    #bengine-startup-detail { max-width: 720px; color: #aeb6c2; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #bengine-startup[data-failed="true"] #bengine-startup-title { display: block; color: #ff9b9b; }
    #bengine-startup[data-failed="true"] #bengine-startup-detail { display: block; }
    #bengine-startup[data-failed="true"] #bengine-startup-presentation { display: none; }
  </style>
</head>
<body>
  <canvas id="bengine-game" tabindex="0" aria-label="BEngine Player" aria-hidden="true"></canvas>
  <div id="bengine-accessibility"></div>
  <div id="bengine-accessibility-live" aria-live="polite" aria-atomic="true"></div>
  <div id="bengine-startup" role="status" aria-live="polite" aria-atomic="true">
    <div id="bengine-startup-presentation">
      <img id="bengine-startup-logo" alt="BEngine">
      <div id="bengine-startup-track" role="progressbar" aria-label="Preparing player" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bengine-startup-progress"></div></div>
    </div>
    <div id="bengine-startup-title"></div>
    <div id="bengine-startup-detail"></div>
  </div>
  <script>
    // Install before module imports so a missing or stale script is visible too.
    (() => {
      const host = document.querySelector('#bengine-startup');
      const title = document.querySelector('#bengine-startup-title');
      const detail = document.querySelector('#bengine-startup-detail');
      const logo = document.querySelector('#bengine-startup-logo');
      const track = document.querySelector('#bengine-startup-track');
      const fill = document.querySelector('#bengine-startup-progress');
      const config = /* BENGINE_STARTUP_PRESENTATION */ null;
      if (config) {
        logo.src = config.logo; host.style.background = config.background;
        const icon = config.icon || config.logo;
        document.querySelector('#bengine-app-icon').href = icon;
        document.querySelector('#bengine-touch-icon').href = icon;
      }
      let started = performance.now();
      let finished = false, failed = false, prepared = false, progress = 0;
      let completion;
      const parts = { bootstrap: 0, download: 0, unpack: 0, verified: 0, resources: 0, runtime: 0, environment: 0 };
      let resolveFade;
      const fade = new Promise(resolve => { resolveFade = resolve; });
      // A composited opacity animation can continue while Wasm initializes.
      // Start preparation immediately; only the handoff waits for this animation.
      const animate = () => {
        started = performance.now();
        logo.dataset.animate = '';
        setTimeout(() => {
          if (!finished && !failed && !prepared) host.dataset.progressVisible = '';
        }, 500);
      };
      logo.addEventListener('animationend', () => resolveFade(), { once: true });
      // Wait for the actual image, not a blank image's animation, on a cold decode.
      // Environment loading in the module script is independent of this promise.
      const imageReady = logo.decode ? logo.decode().catch(() => {}) : Promise.resolve();
      imageReady.then(animate);
      function report(value) {
        if (prepared || finished || failed || !Number.isFinite(value)) return;
        progress = Math.max(progress, Math.min(.999, Math.max(0, value)));
        fill.style.transform = `scaleX(${progress})`;
        track.setAttribute('aria-valuenow', String(Math.floor(progress * 1000) / 10));
      }
      function update(part, value) {
        if (!Number.isFinite(value)) return;
        parts[part] = Math.max(parts[part], Math.min(1, Math.max(0, value)));
        report(.04 * parts.bootstrap + .55 * parts.download + .08 * parts.unpack +
          .08 * parts.verified + .02 * parts.resources + .08 * parts.runtime + .15 * parts.environment);
      }
      function download(part, loaded, total) {
        if (prepared || finished || failed) return;
        update(part, total > 0 ? loaded / total : 0);
      }
      function messageOf(reason) {
        return typeof reason === 'string' ? reason
          : typeof reason?.message === 'string' ? reason.message : '运行环境或游戏资源未能加载。';
      }
      function showFailure(reason) {
        if (finished || failed) return;
        failed = true;
        host.dataset.failed = 'true';
        title.textContent = '游戏启动失败';
        detail.textContent = `${messageOf(reason).slice(0, 2000)}\n请刷新重试；若仍失败，请检查服务器中的 Web 文件是否完整。`;
      }
      function onError(event) {
        if (event.target?.tagName === 'SCRIPT') showFailure(event.error || event.message || event.target.src);
      }
      window.addEventListener('error', onError, true);
      globalThis.BEngineStartupStatus = {
        fail: showFailure,
        retry() { /* Keep the last measured progress during network retries. */ },
        get elapsedMilliseconds() { return performance.now() - started; },
        bootstrap(loaded, total) { download('bootstrap', loaded, total); },
        bootstrapReady() { update('bootstrap', 1); },
        progress(loaded, total) { if (total > 0) update('resources', loaded / total); },
        download(loaded, total) { download('download', loaded, total); },
        verified(loaded, total) {
          if (total > 0) update('verified', loaded / total);
        },
        preparing(value) { update('environment', value); },
        runtimeReady() {
          update('verified', 1); update('resources', 1); update('runtime', 1);
        },
        frameworkReady() { update('unpack', 1); },
        complete() {
          if (completion) return completion;
          completion = (async () => {
            if (finished || failed) return;
            // Keep an already visible bar. A fast startup still skips it entirely.
            const showFull = host.hasAttribute('data-progress-visible') || performance.now() - started >= 500;
            prepared = true;
            if (showFull) host.dataset.progressVisible = '';
            fill.style.transform = 'scaleX(1)';
            track.setAttribute('aria-valuenow', '100');
            await fade;
            if (showFull && !failed) {
              // Two rAF callbacks cross a paint boundary; a microtask does not.
              await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
              globalThis.BEnginePlayer?.ConfirmStartupProgressPresented?.();
              await new Promise(resolve => setTimeout(resolve, 100));
            }
            if (failed) return;
            finished = true;
            host.remove();
            window.removeEventListener('error', onError, true);
            delete globalThis.BEngineStartupStatus;
          })();
          return completion;
        }
      };
    })();
  </script>
  <script type="module" data-bengine-main="./player.bin" data-bengine-integrity="BENGINE_PLAYER_INTEGRITY">
    // Revalidate the small entry document, then reuse the content-stamped module
    // graph. No timestamps or random cache-busting URLs are added to large files.
    const entry = document.querySelector('script[data-bengine-main]');
    const fallback = new URL(entry.dataset.bengineMain, document.baseURI);
    let main = fallback;
    let integrity = entry.dataset.bengineIntegrity;
    const index = new URL('./index.html', document.baseURI);
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        if (attempt) await new Promise(resolve => setTimeout(resolve, attempt === 1 ? 250 : 1000));
        const response = await fetch(index, { cache: attempt ? 'reload' : 'no-cache', credentials: 'same-origin' });
        if (!response.ok) {
          const error = new Error(`Unable to revalidate the player entry (HTTP ${response.status}).`);
          error.permanent = response.status >= 400 && response.status < 500 && response.status !== 408 && response.status !== 429;
          throw error;
        }
        const current = new DOMParser().parseFromString(await response.text(), 'text/html');
        const script = current.querySelector('script[data-bengine-main]');
        const source = script?.getAttribute('data-bengine-main');
        if (!source) throw new Error('The current player entry does not contain a main module.');
        const candidate = new URL(source, response.url || index);
        if (candidate.origin !== fallback.origin || candidate.pathname !== fallback.pathname)
          throw new Error('The current player entry contains an unexpected main module URL.');
        main = candidate;
        integrity = script.getAttribute('data-bengine-integrity');
        break;
      } catch (error) {
        // Cached complete players can still start while the entry server is
        // temporarily unavailable. Actual module/runtime failures remain visible.
        if (error.permanent || attempt === 2) {
          console.warn('Using the cached player entry.', error);
          break;
        }
      }
    }
    async function loadPlayer() {
      if (typeof DecompressionStream !== 'function') throw new Error('Please update your browser to load this game.');
      if (!/^sha256-[A-Za-z0-9+/]{43}=$/.test(integrity || '')) throw new Error('The player integrity metadata is invalid.');
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          if (attempt) await new Promise(resolve => setTimeout(resolve, attempt === 1 ? 250 : 1000));
          const response = await fetch(main, { integrity, cache: attempt ? 'reload' : 'no-cache', credentials: 'same-origin' });
          if (!response.ok) {
            const error = new Error(`Unable to load the player (HTTP ${response.status}).`);
            error.permanent = response.status >= 400 && response.status < 500 && response.status !== 408 && response.status !== 429;
            throw error;
          }
          const total = Number(response.headers.get('Content-Length')) || 0;
          let loaded = 0;
          const measured = response.body.pipeThrough(new TransformStream({ transform(chunk, controller) {
            loaded += chunk.byteLength;
            globalThis.BEngineStartupStatus?.bootstrap?.(loaded, total);
            controller.enqueue(chunk);
          } }));
          const source = await new Response(measured.pipeThrough(new DecompressionStream('gzip'))).text();
          globalThis.BEngineStartupStatus?.bootstrapReady?.();
          return URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
        } catch (error) { if (error.permanent || attempt === 2) throw error; }
      }
    }
    let moduleUrl;
    try { moduleUrl = await loadPlayer(); await import(moduleUrl); }
    catch (error) { globalThis.BEngineStartupStatus?.fail?.(error); throw error; }
    finally { if (moduleUrl) URL.revokeObjectURL(moduleUrl); }
  </script>
</body>
</html>
