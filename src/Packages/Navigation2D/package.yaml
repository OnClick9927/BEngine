format: BEngine.Package
version: 2
type: package
id: com.bengine.navigation2d
packageVersion: 1.0.0
minimumEngineVersion: 0.1.0
displayName: 2D Navigation
description: >-
  Fix64 grid navigation with surfaces, area masks, modifiers, links, partial paths and agents with braking, path copying and rebake-aware repathing.
  Bake walkable grids from scene geometry, assign area costs and masks, and connect regions with links. Agents follow complete or partial paths with braking and automatic repathing when a surface changes. Includes surface/agent inspectors, navigation debugging, example scenes and runtime documentation.
enabledByDefault: false
