format: BEngine.Package
version: 2
type: package
id: com.bengine.tiledmap
packageVersion: 1.0.0
minimumEngineVersion: 0.1.0
displayName: Tiled Map
description: >-
  2D tile palettes, atlas regions and tilemaps with runtime painting, camera culling, sorting, point sampling, pixel snapping and hot-update-aware texture caching.
  Create palettes from texture atlases, paint and erase tiles in the editor or at runtime, and render large maps with camera culling. Configure sorting, pixel snapping and point sampling for pixel art. Includes palette and tilemap editors, painting examples and resource-loading documentation.
enabledByDefault: false
