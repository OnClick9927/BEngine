<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Track Editor</title><h1>Track Editor</h1><p>编辑器专用的轨道画布，依赖 UIElements.Editor。启用 <code>com.bengine.track-editor</code>，引用 <code>BEngine.TrackEditor.Editor</code>。</p><p><code>BEngine.Editor.TrackEditorCanvas</code> 接收轨道、片段、关键帧和标记，提供时间尺、曲线、播放指针、选择、拖动与修剪。资产、Undo/Redo、播放调度和保存由使用方管理。</p><p>公开命名空间保持不变；预编译扩展需要重新编译以引用新程序集。本包不会进入 Player 运行时。</p></html>
