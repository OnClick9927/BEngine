name: Sync BEngine

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Clone source repository
        env:
          SOURCE_URL: ${{ secrets.SOURCE_REPOSITORY_URL }}
        run: |
          set -eux

          echo "=== Clone source repository ==="
          git clone "$SOURCE_URL" repo

      - name: Show source information
        working-directory: repo
        run: |
          git branch -a
          git remote -v
          git log -5 --oneline

      - name: Push to GitHub
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add github \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/OnClick9927/BEngine.git"

          SOURCE_BRANCH=$(git symbolic-ref --short HEAD)

          echo "Source branch: $SOURCE_BRANCH"

          git push github "$SOURCE_BRANCH:main"

          git push github --tags
