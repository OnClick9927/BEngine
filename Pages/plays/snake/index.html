<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BEngine Player</title>
  <link id="bengine-app-icon" rel="icon" type="image/png">
  <link id="bengine-touch-icon" rel="apple-touch-icon">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101214; }
    #bengine-game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #bengine-accessibility { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .bengine-a11y-node {
      position: fixed; overflow: hidden; pointer-events: none; opacity: .001;
      color: transparent; background: transparent; border: 0; white-space: nowrap;
    }
    #bengine-accessibility-live { position: fixed; width: 1px; height: 1px; overflow: hidden; opacity: .001; }
    #bengine-startup {
      position: fixed; inset: 0; display: grid; place-content: center;
      box-sizing: border-box; padding: 24px; color: #e4e7eb; background: #10161a;
      font: 16px/1.5 system-ui, sans-serif; text-align: center; pointer-events: none;
    }
    #bengine-startup-presentation { width: min(240px, 48vw); }
    #bengine-startup-logo { display: block; width: 100%; height: min(180px, 32vh); object-fit: contain; opacity: 0; }
    #bengine-startup-logo[data-animate] { animation: bengine-logo-in .5s linear both; }
    @keyframes bengine-logo-in { from { opacity: 0; } to { opacity: 1; } }
    #bengine-startup-track { height: 5px; margin-top: 28px; background: #394149; overflow: hidden; visibility: hidden; }
    #bengine-startup[data-progress-visible] #bengine-startup-track { visibility: visible; }
    #bengine-startup-progress { width: 100%; height: 100%; background: #c7d3df; transform: scaleX(0); transform-origin: left; }
    #bengine-startup-title, #bengine-startup-detail { display: none; }
    #bengine-startup-detail { max-width: 720px; color: #aeb6c2; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #bengine-startup[data-failed="true"] #bengine-startup-title { display: block; color: #ff9b9b; }
    #bengine-startup[data-failed="true"] #bengine-startup-detail { display: block; }
    #bengine-startup[data-failed="true"] #bengine-startup-presentation { display: none; }
  </style>
</head>
<body>
  <canvas id="bengine-game" tabindex="0" aria-label="BEngine Player" aria-hidden="true"></canvas>
  <div id="bengine-accessibility"></div>
  <div id="bengine-accessibility-live" aria-live="polite" aria-atomic="true"></div>
  <div id="bengine-startup" role="status" aria-live="polite" aria-atomic="true">
    <div id="bengine-startup-presentation">
      <img id="bengine-startup-logo" alt="BEngine">
      <div id="bengine-startup-track" role="progressbar" aria-label="Preparing player" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bengine-startup-progress"></div></div>
    </div>
    <div id="bengine-startup-title"></div>
    <div id="bengine-startup-detail"></div>
  </div>
